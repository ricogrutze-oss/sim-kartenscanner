<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f1115"/>

  <!-- SIM card body (cut corner top-right) -->
  <path d="M 136 96
           L 320 96
           L 376 152
           L 376 416
           Q 376 432 360 432
           L 152 432
           Q 136 432 136 416
           L 136 112
           Q 136 96 152 96 Z"
        fill="#e8eaed" stroke="#2dd4bf" stroke-width="10"/>

  <!-- folded corner triangle -->
  <path d="M 320 96 L 320 140 Q 320 152 332 152 L 376 152 Z" fill="#171a21"/>

  <!-- chip -->
  <rect x="176" y="196" width="112" height="88" rx="14" fill="#d4a938" stroke="#171a21" stroke-width="6"/>
  <line x1="176" y1="222" x2="288" y2="222" stroke="#171a21" stroke-width="5"/>
  <line x1="176" y1="248" x2="288" y2="248" stroke="#171a21" stroke-width="5"/>
  <line x1="176" y1="258" x2="288" y2="258" stroke="#171a21" stroke-width="5"/>
  <line x1="220" y1="196" x2="220" y2="284" stroke="#171a21" stroke-width="5"/>
  <line x1="244" y1="196" x2="244" y2="284" stroke="#171a21" stroke-width="5"/>

  <!-- SIM label -->
  <text x="256" y="368" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800"
        fill="#171a21" text-anchor="middle" letter-spacing="4">SIM</text>

  <!-- Rückgabe label below card -->
  <text x="256" y="480" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700"
        fill="#2dd4bf" text-anchor="middle" letter-spacing="1">Rückgabe</text>
</svg>
